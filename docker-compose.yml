services:
  fast-pdfedit:
    image: ghcr.io/nath-veloz/fast-pdfedit:latest
    container_name: fast-pdfedit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PDFCRAFT_PROBE_EXE: /app/bin/pdfcraft_probe
      PDFCRAFT_PROBE_TIMEOUT: "25"
      MAX_FILE_SIZE_MB: "10"
      MAX_STORED_FILES: "8"
      MAX_CACHED_PNGS: "40"
      MAX_CONCURRENT_PROBE_CALLS: "1"
      MAX_TEMP_PDFS: "12"
      SESSION_TTL_SECONDS: "1800"
    mem_limit: 650m
    memswap_limit: 1150m